name: Teste das fontes de preço 🧪

on:
  workflow_dispatch:
    inputs:
      rota:
        description: "origem destino inicio fim [noites]  — ou 'monitor' pra rodar o monitor completo sem avisar"
        default: "MAO VVI 2027-05-25 2027-09-05"
      apify:
        description: "Comparar com a Apify (gasta ~US$ 0,02)"
        type: boolean
        default: true

jobs:
  comparar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests PyYAML "flights @ git+https://github.com/punitarani/fli.git"
      - name: Comparar
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          ROTA: ${{ inputs.rota }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: |
          if [ "$ROTA" = "serp" ]; then python testar_serp.py; elif [ "$ROTA" = "links" ]; then python testar_links.py; elif [ "$ROTA" = "monitor" ]; then python monitor.py --teste; else python comparar_fontes.py $ROTA ${{ inputs.apify && ' ' || '--sem-apify' }}; fi

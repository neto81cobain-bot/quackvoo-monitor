name: QuackVoo Vigia 👀

on:
  schedule:
    - cron: "41 * * * *"   # reserva: o relógio principal (a cada 15 min) é o Worker da Cloudflare
  workflow_dispatch:
    inputs:
      comando:
        description: "Comando do Telegram (enviado pelo Worker da Cloudflare)"
        required: false
        default: ""
      webhook:
        description: "Endereço do Worker pra ligar os comandos rápidos"
        required: false
        default: ""

# rodadas do relógio uma de cada vez (a que chegar enquanto outra roda espera; as repetidas são descartadas);
# comandos do Telegram rodam na hora, cada um no seu grupo
concurrency:
  group: ${{ (inputs.comando != '' || inputs.webhook != '') && format('cmd-{0}', github.run_id) || 'vigia-relogio' }}
  cancel-in-progress: false

permissions:
  id-token: write   # prova pra Cloudflare que é este repositório (chave da SerpAPI)
  contents: write   # salva as rotas mudadas por comando do Telegram
  actions: write    # /agora e refazer a busca que o GitHub pulou

jobs:
  vigiar:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install requests PyYAML "flights @ git+https://github.com/punitarani/fli.git"
      - name: Lembrar do estado anterior
        uses: actions/cache/restore@v4
        with:
          path: dados/vigia.json
          key: vigia-${{ github.run_id }}
          restore-keys: vigia-
      - name: Chave da SerpAPI (guardada na Cloudflare)
        run: |
          OIDC=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=quackvoo" | python -c "import json,sys;print(json.load(sys.stdin).get('value',''))")
          K=$(curl -s -f -H "Authorization: Bearer $OIDC" https://quackvoo.quackvoo-neto.workers.dev/chave-serp || true)
          if [ ${#K} -ge 32 ]; then echo "::add-mask::$K"; echo "SERPAPI_KEY_CF=$K" >> "$GITHUB_ENV"; echo "chave ok"; else echo "sem chave na Cloudflare"; fi
      - name: Vigiar
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY || env.SERPAPI_KEY_CF }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          COMANDO: ${{ inputs.comando }}
          WEBHOOK: ${{ inputs.webhook }}
        run: python vigia.py
      - name: Guardar o estado
        if: always()
        uses: actions/cache/save@v4
        with:
          path: dados/vigia.json
          key: vigia-${{ github.run_id }}
      - name: Salvar rotas mudadas por comando
        run: |
          git config user.name "QuackVoo"
          git config user.email "quackvoo@users.noreply.github.com"
          git add rotas.yaml
          git diff --cached --quiet && exit 0
          git commit -m "🤖 rotas alteradas pelo Telegram"
          for i in 1 2 3 4; do git pull --rebase -q && git push -q && exit 0; sleep $((i*5)); done
          exit 1

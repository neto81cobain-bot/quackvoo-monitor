name: QuackVoo Monitor 🦆✈️

on:
  schedule:
    - cron: "7 13 * * *"   # 10:07 (Brasília)
    - cron: "7 21 * * *"   # 18:07 (Brasília)
  workflow_dispatch:         # botão "Run workflow" para rodar na hora
    inputs:
      forcar:
        description: "Mandar o relatório mesmo sem queda"
        type: boolean
        default: true

permissions:
  id-token: write   # prova pra Cloudflare que é este repositório (chave da SerpAPI)
  contents: write            # para salvar o histórico de preços no próprio repositório

jobs:
  monitorar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Ler o estado do vigia (o que ele já avisou)
        uses: actions/cache/restore@v4
        with:
          path: dados/vigia.json
          key: vigia-${{ github.run_id }}
          restore-keys: vigia-
      - name: Navegador para desenhar o relatório
        run: python -m playwright install --with-deps chromium
      - name: Chave da SerpAPI (guardada na Cloudflare)
        run: |
          OIDC=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=quackvoo" | python -c "import json,sys;print(json.load(sys.stdin).get('value',''))")
          K=$(curl -s -f -H "Authorization: Bearer $OIDC" https://quackvoo.quackvoo-neto.workers.dev/chave-serp || true)
          if [ ${#K} -ge 32 ]; then echo "::add-mask::$K"; echo "SERPAPI_KEY_CF=$K" >> "$GITHUB_ENV"; echo "chave ok"; else echo "sem chave na Cloudflare"; fi
      - name: Olhar os preços
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY || env.SERPAPI_KEY_CF }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor.py ${{ (github.event_name == 'workflow_dispatch' && inputs.forcar) && '--forcar' || '' }}
      - name: Salvar histórico
        run: |
          git config user.name "QuackVoo"
          git config user.email "quackvoo@users.noreply.github.com"
          git add dados/historico.json
          git diff --cached --quiet && exit 0
          git commit -m "🦆 preços de $(TZ=America/Sao_Paulo date +%d/%m\ %H:%M)"
          for i in 1 2 3 4; do git pull --rebase -q && git push -q && exit 0; sleep $((i*5)); done
          exit 1

name: QuackVoo Monitor 🦆✈️

on:
  schedule:
    - cron: "7 8 * * *"   # 08h07 da manhã (horário de Brasília)
    - cron: "30 20 * * *"    # 21h00 da noite (horário de Brasília)
  workflow_dispatch:         # botão "Run workflow" para rodar na hora
    inputs:
      forcar:
        description: "Mandar o relatório mesmo sem queda"
        type: boolean
        default: true

permissions:
  contents: write            # para salvar o histórico de preços no próprio repositório

jobs:
  monitorar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Olhar os preços
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor.py ${{ (github.event_name == 'workflow_dispatch' && inputs.forcar) && '--forcar' || '' }}
      - name: Salvar histórico
        run: |
          git config user.name "QuackVoo"
          git config user.email "quackvoo@users.noreply.github.com"
          git add dados/historico.json
          git diff --cached --quiet || git commit -m "🦆 preços de $(date +%d/%m)"
          git push
